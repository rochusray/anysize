[package]
name = "anysize"
version = "0.3.0"
edition = "2024"
license-file = "LICENSE.md"
description = "A const no-std zero cost abstraction, adding types for data sizes"
repository = "https://github.com/rochusray/anysize"
keywords = ["bit", "bits", "byte", "bytes", "no-std"]
categories = ["data-structures", "development-tools", "no-std"]

[dependencies]
concat-idents = "1.1.5"

[features]
#default = ["default_sizes", "default_types"]
default = ["u8", "bytes"]
full = ["full_sizes", "full_types"]

# Native Internal Types
u8 = []
u16 = []
u32 = []
u64 = []
u128 = []
usize = []

# Types
bits = []
bytes = []
hwords = []
words = []
dwords = []
qwords = []
ywords = []
zwords = []

default_sizes = ["u8", "u32", "usize"]
full_native_sizes = ["u8", "u16", "u32", "u64", "u128", "usize"]
full_sizes = ["full_native_sizes"]
default_types = ["bits", "bytes", "words"]
full_types = ["bits", "bytes", "hwords", "words", "dwords", "qwords", "ywords", "zwords"]
